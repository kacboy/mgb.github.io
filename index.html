  <link rel="icon" href="/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #77cc77 !important;
      color-scheme: light !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* Stacks image and social links vertically */
      justify-content: center;
      align-items: center;
      gap: 16px; /* Spacing between image and social links */
      position: relative;
      overflow: hidden;
    }

    /* Vignette layer */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle,
        rgba(0, 0, 0, 0) 30%,
        rgba(0, 0, 0, 0.35) 100%
      );
      pointer-events: none;
    }

    .wiggle-image {
      width: 200px;
      height: 200px;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      position: relative;
      z-index: 1;
      border-radius: 50%;
      display: block;

      /* Natural ease-out settlement when mouse leaves */
      animation: settle 0.4s ease-out forwards;
    }

    .wiggle-image:hover {
      /* Fast active wiggle while hovering */
      animation: wiggle 0.35s linear infinite;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px; /* Adds space between the image and social links */
      z-index: 1; /* Ensures content sits above the vignette layer */
    }

    /* Fast, infinite loop on hover */
    @keyframes wiggle {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(-9deg); }
      50%  { transform: rotate(0deg); }
      75%  { transform: rotate(9deg); }
      100% { transform: rotate(0deg); }
    }

    /* Eased decay sequence when hover stops */
    @keyframes settle {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(-6deg); }
      40%  { transform: rotate(4deg); }
      60%  { transform: rotate(-2deg); }
      80%  { transform: rotate(1deg); }
      100% { transform: rotate(0deg); }
    }

    .social {
      
    }

    .social a {
      font-size: 24px;
      color: white;
      text-shadow: 0 1.4px 5px rgba(0, 0, 0, 0.5);
      /* background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 5%, var(--color-white) 5%, var(--color-white) 87.5%, rgba(255, 255, 255, 0) 87.5%); */
    }

    .social a:hover {
      color: black;
      text-shadow: unset;
          /* background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 5%, var(--color-green) 5%, var(--color-green) 87.5%, rgba(255, 255, 255, 0) 87.5%); */
    }

    :root {
      /* Tells Chrome & native engine NOT to invert colors on this page */
      color-scheme: only light;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="img/face.png" class="wiggle-image" width="200" height="200">
    <div class="social">

      <a href="https://www.youtube.com/@MarcusBlackstock" class="mdi mdi-youtube mdi-24px" title="YouTube"></a>
      <a href="https://www.youtube.com/@kacboy" class="mdi mdi-emoticon-poop mdi-24px" title="@kacboy"></a>
      <a href="mailto:me@marcusblackstock.com" class="mdi mdi-email mdi-24px" title="Email"></a>
    </div>
  </div>
</body>
